<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reserva confirmada</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .ok-wrap{padding:40px 16px;max-width:960px;margin:0 auto}
    .ok-card{background:#10222e;color:#fff;border-radius:20px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.22)}
    .ok-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
    .ok-item{background:rgba(255,255,255,.07);padding:14px 16px;border-radius:14px}
    .ok-label{font-size:.9rem;opacity:.78;margin-bottom:6px}
    .ok-value{font-size:1.05rem;font-weight:700}
    .ok-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
    .ok-note{margin-top:14px;opacity:.86}
    .ok-error{background:#fff4f4;color:#7a1414;padding:16px;border-radius:14px}
    @media (max-width:760px){.ok-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="ok-wrap">
    <div id="statusBox" class="ok-card">
      <h1 style="margin:0 0 10px">Estamos confirmando tu reserva</h1>
      <p style="margin:0;opacity:.9;max-width:60ch">Tu pago ya volvió desde Mercado Pago. Estamos esperando que la reserva termine de impactar en el sistema.</p>
      <p class="ok-note" id="liveMsg">Aguantá unos segundos, el comprobante PDF se genera solo cuando la reserva aparece guardada.</p>
    </div>
  </div>

  <script>
    (async function(){
      const statusBox = document.getElementById('statusBox');
      const liveMsg = document.getElementById('liveMsg');
      const params = new URLSearchParams(location.search);
      const ref = (params.get('ref') || '').trim();

      function esc(s){
        return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }
      function money(n){
        try { return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n||0)); }
        catch { return '$ ' + Math.round(Number(n||0)); }
      }
      function fmtDate(iso){
        if(!iso) return '-';
        const [y,m,d] = String(iso).split('-');
        return y && m && d ? `${d}/${m}/${y}` : iso;
      }
      function triggerPdf(ref){
        const a = document.createElement('a');
        a.href = `/api/reservation-pdf?ref=${encodeURIComponent(ref)}`;
        a.download = `comprobante-${ref}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      if(!ref){
        statusBox.className = 'ok-error';
        statusBox.innerHTML = '<strong>No encontramos el código de reserva.</strong><br>Volvé al inicio o escribinos por WhatsApp para verificar el pago.';
        return;
      }

      async function getReserva(){
        const r = await fetch(`/api/reservation-by-ref?ref=${encodeURIComponent(ref)}`, { cache: 'no-store' });
        const j = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(j?.error || 'Todavía no aparece la reserva');
        return j.reserva;
      }

      let reserva = null;
      for(let i=0;i<10;i++){
        try {
          reserva = await getReserva();
          if (reserva) break;
        } catch(e) {
          liveMsg.textContent = `Intentando confirmar la reserva... (${i+1}/10)`;
          await new Promise(r => setTimeout(r, 2500));
        }
      }

      if(!reserva){
        statusBox.className = 'ok-error';
        statusBox.innerHTML = `<strong>El pago volvió bien, pero la reserva todavía no aparece guardada.</strong><br>Pasanos este código por WhatsApp para revisarlo: <strong>${esc(ref)}</strong>`;
        return;
      }

      statusBox.className = 'ok-card';
      statusBox.innerHTML = `
        <h1 style="margin:0 0 8px">Reserva confirmada ✅</h1>
        <p style="margin:0;opacity:.92;max-width:62ch">Tu comprobante ya está listo. En unos segundos se descarga el PDF automáticamente con todos los datos de la reserva.</p>
        <div class="ok-grid">
          <div class="ok-item"><div class="ok-label">Código</div><div class="ok-value">${esc(reserva.ref || ref)}</div></div>
          <div class="ok-item"><div class="ok-label">Titular</div><div class="ok-value">${esc(reserva.nombre || '-')}</div></div>
          <div class="ok-item"><div class="ok-label">Check-in</div><div class="ok-value">${esc(fmtDate(reserva.checkin))}</div></div>
          <div class="ok-item"><div class="ok-label">Check-out</div><div class="ok-value">${esc(fmtDate(reserva.checkout))}</div></div>
          <div class="ok-item"><div class="ok-label">Noches</div><div class="ok-value">${esc(reserva.noches || 0)}</div></div>
          <div class="ok-item"><div class="ok-label">Personas</div><div class="ok-value">${esc(reserva.personas || 0)}</div></div>
          <div class="ok-item"><div class="ok-label">Total</div><div class="ok-value">${esc(money(reserva.total))}</div></div>
          <div class="ok-item"><div class="ok-label">Seña pagada</div><div class="ok-value">${esc(money(reserva.senia))}</div></div>
          <div class="ok-item"><div class="ok-label">Saldo pendiente</div><div class="ok-value">${esc(money(reserva.saldo))}</div></div>
          <div class="ok-item"><div class="ok-label">Estado</div><div class="ok-value">${esc(reserva.status || '-')}</div></div>
        </div>
        <div class="ok-actions">
          <a class="btn btn--filled" href="/api/reservation-pdf?ref=${encodeURIComponent(ref)}" target="_blank" rel="noopener">Descargar comprobante PDF</a>
          <a class="btn" href="/">Volver al inicio</a>
        </div>
        <p class="ok-note">Si la descarga no arranca sola, usá el botón de arriba.</p>
      `;

      setTimeout(() => triggerPdf(ref), 500);
    })();
  </script>
</body>
</html>
