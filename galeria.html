<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galería | Aguara Lodge</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔥 NAV REAL COPIADO DE TU INDEX -->
<nav class="nav">
  <div class="nav__wrap">
    <a href="index.html" class="brand">
      <div class="brand__mark"></div>
      <div class="brand__txt">
        <span class="brand__name">Aguara Lodge</span>
        <span class="brand__tag">Reconquista · Santa Fe</span>
      </div>
    </a>

    <div class="nav__spacer"></div>

    <div class="nav__links">
      <a href="index.html#cabanas">Cabañas</a>
      <a href="index.html#actividades">Actividades</a>
      <a href="galeria.html">Galería</a>
      <a href="index.html#reservas" class="cta">Reservas</a>
    </div>
  </div>
</nav>

<section>
  <div class="wrap">

    <div class="section__title">
      <h2>Galería</h2>
      <p>Imágenes reales del lodge, el río y la experiencia en la isla.</p>
    </div>

    <!-- 🔥 MISMO GRID QUE USÁS EN INDEX -->
    <div class="gallery" id="galeria"></div>

  </div>
</section>

<!-- LIGHTBOX (YA EXISTE EN TU CSS) -->
<div id="lightbox" class="lightbox">
  <img id="lightbox-img">
</div>

<script src="galeria.js"></script>

<script>
const lightbox = document.getElementById("lightbox");
const img = document.getElementById("lightbox-img");

document.addEventListener("click", (e) => {
  if (e.target.classList.contains("galeria-img")) {
    lightbox.classList.add("open");
    img.src = e.target.src;
  } else if (e.target === lightbox) {
    lightbox.classList.remove("open");
  }
});
</script>

</body>
</html>
