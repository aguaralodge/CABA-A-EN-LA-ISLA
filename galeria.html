<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería | Aguará Lodge</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b1320;
      color: white;
    }

    h1 {
      text-align: center;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card h3 {
      margin: 10px;
    }

    .card p {
      margin: 10px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<h1>Galería Aguará Lodge</h1>

<div id="galeria" class="grid"></div>

<script src="galeria.js"></script>

</body>
</html>
